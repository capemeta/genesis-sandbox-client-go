    ExecSessionRequest:
      type: object
      description: Synchronous exec request. Exactly one of code/command is required.
      properties:
        output_directory:
          type: string
          pattern: ^output/[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          description: Optional fresh invocation output directory; fixed management-owned
            ACL, never an arbitrary host path.
        operation_id:
          type: string
          maxLength: 128
          description: Caller operation identity, deduplicated per principal and session.
            Reuse after an ambiguous transport failure.
        subprocess_policy:
          type: string
          enum:
          - allow
          - deny
          description: deny requires explicit command and kernel seccomp enforcement;
            threads remain allowed.
        command:
          type: array
          items:
            type: string
        code:
          type: string
        language:
          type: string
          enum:
          - python
          - node
          - javascript
          - shell
          - bash
        working_dir:
          type: string
          description: Per-exec working directory override. Defaults to session default_cwd.
        env:
          type: object
          description: Environment variables are applied only to this execution and
            are never persisted or returned.
          additionalProperties:
            type: string
        timeout_seconds:
          type: integer
          minimum: 1
          description: Exec timeout. Bounded by profile limit.
    AsyncExecRequest:
      type: object
      description: Asynchronous exec request. Exactly one of code/command is required.
      properties:
        trusted_governance:
          $ref: '#/components/schemas/TrustedExecutionGovernance'
        output_directory:
          type: string
          pattern: ^output/[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          description: Optional fresh invocation output directory; bound to original
            execution request.
        operation_id:
          type: string
          maxLength: 128
          description: Caller operation identity, deduplicated per principal and session.
            Reuse after an ambiguous transport failure.
        subprocess_policy:
          type: string
          enum:
          - allow
          - deny
          description: deny requires explicit command and kernel seccomp enforcement;
            threads remain allowed.
        command:
          type: array
          items:
            type: string
        code:
          type: string
        language:
          type: string
          enum:
          - python
          - node
          - javascript
          - shell
          - bash
        working_dir:
          type: string
          description: Per-exec working directory override. Defaults to session default_cwd.
        env:
          type: object
          description: Environment variables are applied only to this execution and
            are never persisted or returned.
          additionalProperties:
            type: string
        timeout_seconds:
          type: integer
          minimum: 1
          description: Exec timeout (starts counting from running, not queued). Bounded
