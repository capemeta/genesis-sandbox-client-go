      - storage_ref
      - resource_id
      - workspace_id
      - source_identity
      - provisioner_id
      - binding_version
      - budget_bytes
      - quota_mb
      - persistent
      - hard_quota
      - owner_tenant_id
      - owner_user_id
      - owner_run_id
      - hard_quota_verified
      - shared_attachment
