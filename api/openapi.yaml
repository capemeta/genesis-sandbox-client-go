      description: The authenticated tenant and user are derived exclusively from
        the Bearer API key. Environment selection uses the same EnvironmentSelector
        as other public endpoints.
      properties:
        workspace_id:
          type: string
        environment:
          $ref: '#/components/schemas/EnvironmentSelector'
        resolution_id:
          type: string
          description: Environment resolution ticket from /v1/environment:resolve.
            Reuses an already resolved immutable environment result. Mutually exclusive
            with environment.
        metadata:
          type: object
          additionalProperties:
            type: string
    RenewRequest:
      type: object
      required:
      - extend_seconds
      properties:
        extend_seconds:
          type: integer
          minimum: 1
    SubmitJobRequest:
      type: object
      additionalProperties: false
      description: Clean public job request. Exactly one of code/command is required.
        `environment` and `resolution_id` are mutually exclusive. Internal fields
        (image, runtime, host paths) and caller-supplied identity fields (tenant_id,
        user_id) are not accepted on the Public surface. Tenant and user are derived
        exclusively from the Bearer API key.
      properties:
        environment:
          $ref: '#/components/schemas/EnvironmentSelector'
        resolution_id:
          type: string
          description: Environment resolution ticket from /v1/environment:resolve.
            Reuses an already resolved immutable environment result. Mutually exclusive
            with environment.
        code:
          type: string
        command:
          type: array
          items:
            type: string
        language:
          type: string
          enum:
          - python
          - node
          - javascript
          - typescript
          description: Code execution language. Only used with `code`; shell or binary
            commands should use `command`.
        timeout_seconds:
          type: integer
          minimum: 1
          description: Bounded by the profile limit max_exec_timeout_seconds (discoverable
            via Catalog).
        queue_wait_timeout_seconds:
          type: integer
          minimum: 0
          maximum: 30
          default: 10
          description: Admission queue wait; unrelated to ?wait which bounds waiting
            for the result.
        workspace_id:
          type: string
        session_id:
          type: string
        idempotency_key:
          type: string
          maxLength: 128
          description: Maximum 128 UTF-8 bytes.
        callback_url:
          type: string
          description: Optional completion webhook; subject to tenant allowlist, HMAC
            signing and bounded retries.
        input_artifact_ids:
          type: array
          items:
            type: string
        env:
          type: object
          description: Merged over profile env baseline; server may redact or reject
            sensitive keys.
          additionalProperties:
            type: string
        metadata:
          type: object
          description: 'Opaque metadata for audit. Convention: metadata["client.trace_ref"]
            carries the caller trace reference.'
          additionalProperties:
            type: string
    JobResult:
      type: object
      properties:
        job_id:
          type: string
        sandbox_id:
          type: string
        tenant_id:
          type: string
        workspace_id:
          type: string
        task_type:
          type: string
        operation:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          - timed_out
          - interrupted
          description: interrupted means execution began but the service restarted
            before a result could be confirmed; reconcile possible side effects before
            retrying.
        exit_code:
          type: integer
        stdout:
          type: string
        stderr:
          type: string
        error_code:
          type: string
          description: Machine-readable execution error. SERVICE_RESTART_INTERRUPTED
            means execution began but its result was not confirmed; SERVICE_RESTART_CANCELLED_BEFORE_START
            means the queued job never began. A persisted terminal QUOTA_EXCEEDED
            means this job was admitted but could not obtain runtime capacity; submit
            a new job with a new idempotency_key after capacity is available. Do not
            replay with the same key or automatically repeat the operation.
        error:
          type: string
        duration_ms:
          type: integer
          format: int64
        stdout_truncated:
          type: boolean
        stderr_truncated:
          type: boolean
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        logs_url:
          type: string
          description: SSE log stream URL; returned when ?wait expires while the job
            is still running.
        idempotency_key:
          type: string
          maxLength: 128
          description: Echo of the caller-provided idempotency key; maximum 128 UTF-8
            bytes.
        effective_policy:
          type: object
          description: Server-resolved execution policy. Secret values are redacted.
        effective_environment:
          $ref: '#/components/schemas/EffectiveEnvironment'
        output_artifacts:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
    JobList:
