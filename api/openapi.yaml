openapi: 3.0.3
info:
  title: Genesis Sandbox Service API
  description: >-
    Secure sandbox API for jobs, sessions, environment profiles, workspaces and artifacts.
    Public surface uses EnvironmentSelector for environment selection; bare sandbox leasing
    is an Advanced API (requires sandbox.advanced scope). Operations marked x-api-layer:
    advanced are not part of the Public surface.
  version: 2.0.0
security:
  - BearerAuth: []
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        "200": { description: OK }
  /readiness:
    get:
      summary: Readiness check
      security: []
      responses:
        "200": { description: Ready }
        "503": { $ref: "#/components/responses/Error" }
  /v1/readyz:
    get:
      summary: Readiness check compatibility path.
      security: []
      responses:
        "200": { description: Ready }
        "503": { $ref: "#/components/responses/Error" }
  /metrics:
    get:
      summary: Prometheus text metrics.
      security: []
      responses:
        "200":
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema: { type: string }
  /v1/sandbox/capabilities:
    x-api-layer: advanced
    get:
      summary: Get runtime capabilities, profiles, supported task types, languages, state policies, and queue limits.
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuntimeCapabilities" }
  /v1/runtime-profiles:
    x-api-layer: advanced
    get:
      summary: List visible runtime profiles (Advanced; exposes image/runtime internals). Public clients use /v1/environment/catalog.
      responses:
        "200":
          description: Runtime profiles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RuntimeProfile" }
  /v1/environment/catalog:
    get:
      operationId: getEnvironmentCatalog
      summary: Public profile catalog with capability vocabulary and behavior limits. Supports ETag conditional requests.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: capability
          in: query
          required: false
          description: Comma-separated capability filter (AND semantics; a card must expose all listed capabilities).
          schema: { type: string, example: "runtime.python,tool.pdf" }
        - name: tag
          in: query
          required: false
          description: Comma-separated tag filter (OR semantics; a card matching any listed tag is kept).
          schema: { type: string, example: "ml,data" }
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Catalog cards visible to the principal
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentCatalog" }
        "304": { description: Not modified }
  /v1/environment:resolve:
    post:
      operationId: resolveEnvironment
      summary: Resolve an EnvironmentSelector into a resolution ticket (default TTL 30 minutes, usable multiple times within TTL, not consumed on use).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResolveEnvironmentRequest" }
      responses:
        "200":
          description: Environment resolution ticket
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentResolution" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/sandboxes:lease:
    x-api-layer: advanced
    post:
      summary: Lease a sandbox (Advanced; requires sandbox.advanced scope).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaseRequest" }
      responses:
        "200":
          description: Sandbox lease
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxLease" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/jobs:
    get:
      operationId: listJobs
      summary: List jobs for the authenticated tenant.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [queued, running, succeeded, failed, cancelled, timed_out] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paged job records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }
    post:
      operationId: submitJob
      summary: Submit a job. Returns immediately unless ?wait is given; on wait expiry returns 200 with status=running and logs_url (not an error).
      parameters:
        - name: wait
          in: query
          required: false
          description: Max duration to wait synchronously for completion, e.g. 30s. Bounded by server config.
          schema: { type: string, example: 30s }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitJobRequest" }
      responses:
        "202":
          description: Job admitted and returned in queued or running state. Poll the job resource or consume logs_url.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResult" }
        "200":
          description: Returned only when ?wait is supplied; may be terminal or still running when the wait bound expires.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResult" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/audits:
    get:
      operationId: listAuditEvents
      summary: List audit events for the authenticated tenant.
      parameters:
        - name: principal_id
          in: query
          schema: { type: string }
        - name: key_id
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: resource_type
          in: query
          schema: { type: string }
        - name: resource_id
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Paged audit events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventList" }
  /v1/sandboxes:
    x-api-layer: advanced
    get:
      summary: List sandbox leases for the authenticated tenant.
      responses:
        "200":
          description: Sandbox leases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SandboxLease" }
  /v1/jobs/{id}:
    get:
      operationId: getJob
      summary: Get a job result.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Job result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResult" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/jobs/{id}:cancel:
    post:
      operationId: cancelJob
      summary: Cancel a queued or running job. Cancel is not delete; the job record remains queryable.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Cancelled }
        "404": { $ref: "#/components/responses/Error" }
  /v1/jobs/{id}/logs:
    get:
      operationId: streamJobLogs
      summary: Stream job logs via SSE.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: cursor
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200": { description: SSE log stream }
  /v1/jobs/{id}/files:
    post:
      operationId: uploadJobFile
      summary: Upload an input file for a job. The file name is passed by query parameter `name` and the body is raw bytes.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: name
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Artifact manifest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
  /v1/jobs/{id}/artifacts:
    get:
      operationId: listJobArtifacts
      summary: List job artifacts.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: Artifacts
          headers:
            X-Total-Count:
              schema: { type: integer }
            X-Next-Offset:
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Artifact" }
  /v1/artifacts/{id}:
    get:
      operationId: downloadArtifact
      summary: Download an artifact by id. Supports HTTP Range or text offset/limit.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: Range
          in: header
          schema: { type: string, example: bytes=0-1023 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200": { description: Artifact bytes }
        "404": { $ref: "#/components/responses/Error" }
  /v1/workspaces:
    post:
      summary: Create a workspace state key.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateWorkspaceRequest" }
      responses:
        "201":
          description: Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
  /v1/workspaces/{id}:
    get:
      summary: Get a workspace.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
    delete:
      summary: Delete a workspace and local artifacts.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Deleted }
  /v1/sessions:
    post:
      operationId: createSession
      summary: Create a logical session backed by a persistent workspace. No runtime is created until the first exec.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "201":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /v1/sessions/{id}:
    get:
      operationId: getSession
      summary: Get a session.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
    delete:
      operationId: deleteSession
      summary: Delete the logical session and release its active runtime. Workspace retention is handled separately.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Deleted }
  /v1/sessions/{id}:renew:
    post:
      operationId: renewSession
      summary: Extend a session lease (client heartbeat) within max lifetime policy.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenewRequest" }
      responses:
        "200":
          description: Renewed session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sessions/{id}:suspend:
    post:
      operationId: suspendSession
      summary: Release the ephemeral runtime while preserving the logical session and workspace.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: force
          in: query
          required: false
          description: When true, cancel all running execs before suspending.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Dormant session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sessions/{id}/exec:
    post:
      operationId: execSession
      summary: Synchronous exec inside a named session (short commands < 30s). Returns ExecRecord with stdout/stderr inline.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecSessionRequest" }
      responses:
        "200":
          description: Session execution result (ExecRecord with stdout/stderr inline)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecRecord" }
  /v1/sessions/{id}/exec:async:
    post:
      operationId: execSessionAsync
      summary: Asynchronous exec. Returns immediately with exec_id; use logs endpoint for SSE streaming.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AsyncExecRequest" }
      responses:
        "201":
          description: Exec record (status=queued)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecRecord" }
        "429": { $ref: "#/components/responses/Error" }
  /v1/sessions/{id}/execs:
    get:
      operationId: listSessionExecs
      summary: List exec records for a session.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Exec record list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecRecordList" }
  /v1/sessions/{id}/execs/{execId}:
    get:
      operationId: getExecRecord
      summary: Get a single exec record by ID.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: execId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Exec record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecRecord" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sessions/{id}/execs/{execId}/logs:
    get:
      operationId: streamExecLogs
      summary: SSE log stream for an async exec. Supports cursor-based reconnection via Last-Event-ID header or ?cursor param.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: execId
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: string }
      responses:
        "200":
          description: SSE event stream (stdout/stderr/status/truncated events with monotonic cursor as id field)
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sessions/{id}/execs/{execId}:cancel:
    post:
      operationId: cancelExec
      summary: Cancel a running or queued exec (SIGINT → grace → SIGKILL). Record is preserved for query.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: execId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated exec record (status=cancelled)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecRecord" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sessions/{id}/context:
    get:
      operationId: getSessionContext
      summary: Get session execution context (cwd + env).
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Session context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionContext" }
    patch:
      operationId: patchSessionContext
      summary: Update session execution context. cwd must be under /workspace.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionContext" }
      responses:
        "200":
          description: Updated session context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionContext" }
        "400": { $ref: "#/components/responses/Error" }
  /v1/sessions/{id}/files:
    get:
      operationId: downloadSessionFile
      summary: Download a file from a session workspace.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: uploadSessionFile
      summary: Upload or overwrite a file in a session workspace.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: If-Match
          in: header
          required: false
          description: Replace only when the current SHA-256 ETag matches.
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          description: Use `*` to create only when the file does not exist.
          schema: { type: string, enum: ["*"] }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceFileInfo" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeSessionFile
      summary: Remove a file or directory from a session workspace.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: path
          in: query
          required: true
          schema: { type: string }
        - name: recursive
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200": { description: Removed }
        default: { $ref: "#/components/responses/Error" }
  /v1/sessions/{id}/files:list:
    get:
      operationId: listSessionFiles
      summary: List session workspace files.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: path
          in: query
          required: false
          schema: { type: string, default: "." }
        - name: recursive
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1000 }
      responses:
        "200":
          description: File list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceListResult" }
        default: { $ref: "#/components/responses/Error" }
  /v1/sessions/{id}/files:stat:
    get:
      operationId: statSessionFile
      summary: Stat a session workspace file or directory.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: path
          in: query
          required: false
          schema: { type: string, default: "." }
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceFileInfo" }
        default: { $ref: "#/components/responses/Error" }
  /v1/sessions/{id}/dirs:
    post:
      operationId: mkdirSessionDir
      summary: Create a directory in a session workspace.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Directory metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceFileInfo" }
        default: { $ref: "#/components/responses/Error" }
  /v1/dependencies:build:
    post:
      operationId: buildDependencies
      summary: Build or resolve a read-only dependency cache fingerprint.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildDependencyRequest" }
      responses:
        "200":
          description: Dependency build metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DependencyBuild" }
  /v1/dependencies/{id}:
    get:
      operationId: getDependencyBuild
      summary: Get dependency build metadata by fingerprint.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Dependency build metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DependencyBuild" }
  /v1/sandboxes/{id}:
    x-api-layer: advanced
    get:
      summary: Get sandbox lease/status/effective policy.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Sandbox lease. ETag is the resource_version.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxLease" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Destroy a sandbox and remove its lease.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Destroyed }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/metadata:
    x-api-layer: advanced
    patch:
      summary: Patch sandbox metadata with If-Match resource_version precondition.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                nullable: true
      responses:
        "200":
          description: Updated sandbox lease
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxLease" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}:release:
    x-api-layer: advanced
    post:
      summary: Release a sandbox lease (single canonical release verb).
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: Released }
  /v1/sandboxes/{id}:renew:
    x-api-layer: advanced
    post:
      summary: Extend an active sandbox lease within max lifetime policy.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenewRequest" }
      responses:
        "200":
          description: Renewed sandbox lease
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxLease" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/sessions:
    x-api-layer: advanced
    post:
      summary: Execute inside a sandbox-scoped session.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecSessionRequest" }
      responses:
        "200":
          description: Session execution result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecSessionResult" }
  /v1/sandboxes/{id}/snapshots:
    x-api-layer: advanced
    post:
      summary: Create a sandbox snapshot.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Snapshot metadata
          content:
            application/json:
              schema: { type: object }
  /v1/snapshots/{id}/restore:
    x-api-layer: advanced
    post:
      summary: Restore a sandbox from a snapshot.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Restored sandbox lease
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxLease" }
  /v1/sandboxes/{id}/viewer:
    get:
      summary: Get a lease-bound viewer descriptor for a GUI sandbox.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Viewer descriptor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewerDescriptor" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/sandboxes/{id}/gui:start:
    post:
      summary: Start the GUI/noVNC stack inside a GUI-capable sandbox.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartGUIRequest" }
      responses:
        "200":
          description: Viewer descriptor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewerDescriptor" }
  /v1/sandboxes/{id}/gui:stop:
    post:
      summary: Stop the GUI/noVNC stack inside a sandbox.
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200": { description: GUI stopped }
  /v1/sandboxes/{id}/viewer-proxy/{path}:
    get:
      summary: Authenticated reverse proxy to the sandbox viewer endpoint.
      security: []
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: path
          in: path
          required: true
          schema: { type: string }
        - name: token
          in: query
          required: false
          schema: { type: string }
      responses:
        "200": { description: Proxied noVNC asset or WebSocket upgrade }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    EnvironmentSelector:
      type: object
      description: >-
        Unified environment selection. `profile` means an explicit environment name chosen by the
        caller; `hints` means capability-based auto selection performed by the server; both absent
        means the default public profile. `profile` and `hints` are mutually exclusive
        (INVALID_SELECTOR when both present).
      properties:
        profile: { $ref: "#/components/schemas/ProfileReference" }
        hints: { $ref: "#/components/schemas/EnvHints" }
    ProfileReference:
      type: object
      required: [name]
      properties:
        name: { type: string, example: office-basic }
        revision: { type: string, description: "Optional pinned revision; defaults to latest." }
    EnvHints:
      type: object
      properties:
        capabilities:
          type: array
          description: Namespaced capability tags (runtime.*, tool.*, document.*, browser.*).
          items: { type: string, example: document.pdf }
        strict:
          type: boolean
          default: false
          description: When true, zero matches return NO_MATCHING_PROFILE instead of falling back to the default profile.
        description:
          type: string
          description: Audit-only free text; never consumed by the resolver.
    EffectiveEnvironment:
      type: object
      description: Answers what was selected, why, and whether it was degraded. Never exposes image/runtime/host internals.
      properties:
        profile_name: { type: string }
        profile_revision: { type: string, description: Opaque server-generated revision string. }
        selection_mode: { type: string, enum: [profile, auto] }
        selection_reason:
          type: array
          description: "Traceability, e.g. default fallback cause or unknown/unsatisfied capabilities."
          items: { type: string }
        capabilities:
          type: array
          items: { type: string }
        degraded: { type: boolean, description: True only when the policy engine actively downgraded the request. }
    ResolveEnvironmentRequest:
      type: object
      required: [environment]
      properties:
        environment: { $ref: "#/components/schemas/EnvironmentSelector" }
        ttl_seconds: { type: integer, minimum: 60, description: "Requested ticket TTL; bounded by server config (default 30 minutes)." }
    EnvironmentResolution:
      type: object
      properties:
        resolution_id: { type: string }
        profile_name: { type: string }
        profile_revision: { type: string }
        selection_mode: { type: string, enum: [profile, auto] }
        selection_reason:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items: { type: string }
        expires_at: { type: string, format: date-time }
    EnvironmentCatalog:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CatalogCard" }
        capability_vocabulary:
          type: array
          description: Full namespaced capability vocabulary recognized by the auto resolver.
          items: { type: string }
        default_profile: { type: string }
        next_offset: { type: integer }
        total: { type: integer }
    CatalogCard:
      type: object
      required: [name, profile_revision]
      properties:
        name: { type: string }
        profile_revision:
          type: string
          description: Opaque immutable revision for exact Resolve after Catalog selection.
        display_name: { type: string }
        description: { type: string }
        capabilities:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        use_when:
          type: array
          description: Display-only guidance; never consumed by the resolver.
          items: { type: string }
        avoid_when:
          type: array
          description: Display-only guidance; never consumed by the resolver.
          items: { type: string }
        limits: { $ref: "#/components/schemas/CatalogCardLimits" }
        features: { $ref: "#/components/schemas/CatalogCardFeatures" }
    CatalogCardLimits:
      type: object
      properties:
        max_exec_timeout_seconds: { type: integer }
        max_session_ttl_seconds: { type: integer }
        workspace_quota_mb: { type: integer }
        max_log_bytes: { type: integer, format: int64 }
        max_concurrent_execs: { type: integer }
    CatalogCardFeatures:
      type: object
      properties:
        viewer: { type: boolean }
        suspend_resume: { type: boolean }
    StartGUIRequest:
      type: object
      properties:
        kind: { type: string, enum: [novnc] }
        resolution: { type: string, example: "1280x800" }
        ttl_seconds: { type: integer, minimum: 60, maximum: 3600, default: 900 }
        metadata:
          type: object
          additionalProperties: { type: string }
    ViewerDescriptor:
      type: object
      properties:
        sandbox_id: { type: string }
        runtime_profile: { type: string }
        status: { type: string, enum: [starting, ready, stopped] }
        kind: { type: string, enum: [novnc] }
        ready: { type: boolean }
        page_url: { type: string }
        websocket_url: { type: string }
        proxy_url: { type: string }
        access_token: { type: string }
        token_header: { type: string, example: X-Genesis-Viewer-Token }
        expires_at: { type: string, format: date-time }
        renew_on_access: { type: boolean }
    ViewerPolicy:
      type: object
      properties:
        supported: { type: boolean }
        default_kind: { type: string }
        allowed_kinds:
          type: array
          items: { type: string }
        port: { type: integer }
        token_ttl_seconds: { type: integer }
        renew_on_access: { type: boolean }
        artifacts:
          type: array
          items: { type: string }
    PlatformSpec:
      type: object
      properties:
        os: { type: string, example: linux }
        architecture: { type: string, example: amd64 }
        variant: { type: string, example: v8 }
    ResourceLimits:
      type: object
      properties:
        memory_mb: { type: integer }
        cpus: { type: number, format: double }
        pids: { type: integer }
        disk_mb: { type: integer }
    NetworkPolicy:
      type: object
      properties:
        mode: { type: string, enum: [none, allowlist, internet, internal] }
        allowed_hosts:
          type: array
          items: { type: string }
    FilesystemPolicy:
      type: object
      properties:
        read_only_rootfs: { type: boolean }
        allowed_host_paths:
          type: array
          items: { type: string }
    SandboxSpec:
      type: object
      properties:
        runtime_profile: { type: string }
        image: { type: string }
        runtime: { type: string }
        platform: { $ref: "#/components/schemas/PlatformSpec" }
        working_dir: { type: string }
        resource_limits: { $ref: "#/components/schemas/ResourceLimits" }
        network_policy: { $ref: "#/components/schemas/NetworkPolicy" }
        filesystem_policy: { $ref: "#/components/schemas/FilesystemPolicy" }
        env:
          type: object
          additionalProperties: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
    PolicyRequest:
      type: object
      properties:
        runtime_profile: { type: string }
        exec_timeout_seconds: { type: integer, minimum: 1 }
        platform: { $ref: "#/components/schemas/PlatformSpec" }
        resource_limits: { $ref: "#/components/schemas/ResourceLimits" }
        network_policy: { $ref: "#/components/schemas/NetworkPolicy" }
        filesystem_policy: { $ref: "#/components/schemas/FilesystemPolicy" }
        env:
          type: object
          additionalProperties: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        credential_bindings:
          type: array
          items: { $ref: "#/components/schemas/CredentialBinding" }
        allow_runtime_install: { type: boolean }
    SecretRef:
      type: object
      required: [name, key]
      properties:
        name: { type: string }
        key: { type: string }
    CredentialBinding:
      type: object
      required: [ref, env]
      properties:
        ref: { $ref: "#/components/schemas/SecretRef" }
        env: { type: string, example: GITHUB_TOKEN }
    LeaseRequest:
      type: object
      description: >-
        Advanced API. The authenticated tenant and user are derived exclusively from the
        Bearer API key and cannot be supplied by the request body. Environment selection
        uses the same EnvironmentSelector as Public endpoints.
      properties:
        workspace_id: { type: string }
        environment: { $ref: "#/components/schemas/EnvironmentSelector" }
        resolution_id: { type: string, description: "Environment resolution ticket from /v1/environment:resolve. Reuses an already resolved immutable environment result. Mutually exclusive with environment." }
        risk_level: { type: string, enum: [low, medium, high] }
        spec: { $ref: "#/components/schemas/SandboxSpec" }
        policy_request: { $ref: "#/components/schemas/PolicyRequest" }
        metadata:
          type: object
          additionalProperties: { type: string }
    RenewRequest:
      type: object
      required: [extend_seconds]
      properties:
        extend_seconds: { type: integer, minimum: 1 }
    SubmitJobRequest:
      type: object
      description: >-
        Clean public job request. Exactly one of code/command is required. `environment` and
        `resolution_id` are mutually exclusive. Internal fields (image, runtime, host paths)
        and caller-supplied identity fields (tenant_id, user_id) are not accepted on the
        Public surface. Tenant and user are derived exclusively from the Bearer API key.
      properties:
        environment: { $ref: "#/components/schemas/EnvironmentSelector" }
        resolution_id: { type: string, description: "Environment resolution ticket from /v1/environment:resolve. Reuses an already resolved immutable environment result. Mutually exclusive with environment." }
        code: { type: string }
        command:
          type: array
          items: { type: string }
        language: { type: string, enum: [python, node, javascript, typescript], description: "Code execution language. Only used with `code`; shell or binary commands should use `command`." }
        timeout_seconds: { type: integer, minimum: 1, description: "Bounded by the profile limit max_exec_timeout_seconds (discoverable via Catalog)." }
        queue_wait_timeout_seconds: { type: integer, minimum: 0, maximum: 30, default: 10, description: "Admission queue wait; unrelated to ?wait which bounds waiting for the result." }
        workspace_id: { type: string }
        session_id: { type: string }
        idempotency_key: { type: string }
        callback_url: { type: string, description: "Optional completion webhook; subject to tenant allowlist, HMAC signing and bounded retries." }
        input_artifact_ids:
          type: array
          items: { type: string }
        env:
          type: object
          description: Merged over profile env baseline; server may redact or reject sensitive keys.
          additionalProperties: { type: string }
        metadata:
          type: object
          description: 'Opaque metadata for audit. Convention: metadata["client.trace_ref"] carries the caller trace reference.'
          additionalProperties: { type: string }
    JobResult:
      type: object
      properties:
        job_id: { type: string }
        sandbox_id: { type: string }
        tenant_id: { type: string }
        workspace_id: { type: string }
        task_type: { type: string }
        operation: { type: string }
        status: { type: string }
        exit_code: { type: integer }
        stdout: { type: string }
        stderr: { type: string }
        error_code: { type: string }
        error: { type: string }
        duration_ms: { type: integer, format: int64 }
        stdout_truncated: { type: boolean }
        stderr_truncated: { type: boolean }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        logs_url: { type: string, description: "SSE log stream URL; returned when ?wait expires while the job is still running." }
        effective_environment: { $ref: "#/components/schemas/EffectiveEnvironment" }
        output_artifacts:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }
    JobList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/JobResult" }
        next_offset: { type: integer }
        total: { type: integer }
    SandboxLease:
      type: object
      properties:
        sandbox_id: { type: string }
        lease_id: { type: string }
        tenant_id: { type: string }
        workspace_id: { type: string }
        runtime_profile: { type: string }
        profile_revision: { type: string, description: "Opaque immutable Profile revision pinned when the Session is created." }
        effective_environment: { $ref: "#/components/schemas/EffectiveEnvironment" }
        status: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        effective_policy: { type: object }
        metadata:
          type: object
          additionalProperties: { type: string }
        resource_version: { type: integer, format: int64 }
    RuntimeCapabilities:
      type: object
      properties:
        available: { type: boolean }
        runtime_kind: { type: string }
        default_runtime: { type: string }
        available_runtimes:
          type: array
          items: { type: string }
        runtime_profiles:
          type: array
          items: { $ref: "#/components/schemas/RuntimeProfile" }
        supported_task_types:
          type: array
          items: { type: string }
        supported_languages:
          type: array
          items: { type: string }
        supported_state_policies:
          type: array
          items: { type: string }
        queue: { $ref: "#/components/schemas/QueueCapabilities" }
        queue_snapshots:
          type: array
          items: { $ref: "#/components/schemas/QueueSnapshot" }
        execd: { $ref: "#/components/schemas/ExecdCapabilities" }
    RuntimeProfile:
      type: object
      properties:
        name: { type: string }
        image: { type: string }
        runtime: { type: string }
        platform: { $ref: "#/components/schemas/PlatformSpec" }
        task_types:
          type: array
          items: { type: string }
        languages:
          type: array
          items: { type: string }
        operations:
          type: array
          items: { type: string }
        reusable: { type: boolean }
        viewer: { $ref: "#/components/schemas/ViewerPolicy" }
    QueueSnapshot:
      type: object
      properties:
        pool_key: { type: string }
        active: { type: integer }
        queued: { type: integer }
    QueueCapabilities:
      type: object
      properties:
        max_waiting: { type: integer }
        default_wait_seconds: { type: integer }
        max_wait_seconds: { type: integer }
    ExecdCapabilities:
      type: object
      properties:
        command: { type: boolean }
        session: { type: boolean }
        files: { type: boolean }
        metrics: { type: boolean }
    CreateWorkspaceRequest:
      type: object
      properties:
        workspace_id: { type: string }
        retention_mode: { type: string, enum: [ttl, explicit_delete], default: ttl }
        ttl_seconds: { type: integer, minimum: 1 }
        quota_mb: { type: integer, minimum: 0 }
        metadata:
          type: object
          additionalProperties: { type: string }
    Workspace:
      type: object
      properties:
        workspace_id: { type: string }
        tenant_id: { type: string }
        user_id: { type: string }
        retention_mode: { type: string, enum: [ttl, explicit_delete] }
        expires_at: { type: string, format: date-time, nullable: true }
        quota_mb: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: { type: string }
    Artifact:
      type: object
      properties:
        artifact_id: { type: string }
        tenant_id: { type: string }
        workspace_id: { type: string }
        job_id: { type: string }
        name: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        mime: { type: string }
        created_at: { type: string, format: date-time }
    CreateSessionRequest:
      type: object
      properties:
        workspace_id: { type: string }
        environment: { $ref: "#/components/schemas/EnvironmentSelector" }
        resolution_id: { type: string, description: "Environment resolution ticket from /v1/environment:resolve. Reuses an already resolved immutable environment result. Mutually exclusive with environment." }
        idempotency_key: { type: string, maxLength: 128 }
        state_policy: { type: string, enum: [session] }
        ttl_seconds: { type: integer, minimum: 1 }
        workspace_retention: { type: string, enum: [ttl, explicit_delete] }
        workspace_ttl_seconds: { type: integer, minimum: 1 }
        metadata:
          type: object
          additionalProperties: { type: string }
    Session:
      type: object
      properties:
        session_id: { type: string }
        tenant_id: { type: string }
        user_id: { type: string }
        workspace_id: { type: string }
        runtime_profile: { type: string }
        profile_revision: { type: string }
        effective_environment: { $ref: "#/components/schemas/EffectiveEnvironment" }
        state_policy: { type: string }
        active_sandbox_id: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: { type: string }
        resource_version: { type: integer, format: int64, minimum: 1 }
    ExecSessionRequest:
      type: object
      description: Synchronous exec request. Exactly one of code/command is required.
      properties:
        command:
          type: array
          items: { type: string }
        code: { type: string }
        language: { type: string, enum: [python, node, javascript, typescript] }
        working_dir: { type: string, description: "Per-exec working directory override. Defaults to session default_cwd." }
        env:
          type: object
          description: Per-exec env overrides merged over session default_env.
          additionalProperties: { type: string }
        timeout_seconds: { type: integer, minimum: 1, description: "Exec timeout. Bounded by profile limit." }
    AsyncExecRequest:
      type: object
      description: Asynchronous exec request. Exactly one of code/command is required.
      properties:
        command:
          type: array
          items: { type: string }
        code: { type: string }
        language: { type: string, enum: [python, node, javascript, typescript] }
        working_dir: { type: string, description: "Per-exec working directory override. Defaults to session default_cwd." }
        env:
          type: object
          description: Per-exec env overrides merged over session default_env.
          additionalProperties: { type: string }
        timeout_seconds: { type: integer, minimum: 1, description: "Exec timeout (starts counting from running, not queued). Bounded by profile limit." }
        callback_url: { type: string, format: uri, description: "Optional completion webhook. Subject to tenant allowlist, HMAC signing, and bounded retries (see §9.3)." }
    ExecRecord:
      type: object
      description: >-
        Unified exec record. Shape aligns with JobResult for client parsing consistency (§7.5).
        For sync exec, stdout/stderr are inline. For async exec, use the logs SSE endpoint.
      properties:
        exec_id: { type: string }
        session_id: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        exit_code: { type: integer }
        error_code: { type: string, description: "Machine-readable error code (EXEC_CANCELLED, EXEC_TIMEOUT, SERVICE_RESTART, STREAM_INTERRUPTED)." }
        stdout: { type: string, description: "Populated only for sync exec." }
        stderr: { type: string, description: "Populated only for sync exec." }
        stdout_truncated: { type: boolean }
        stderr_truncated: { type: boolean }
        working_dir: { type: string }
        effective_environment: { $ref: "#/components/schemas/EffectiveEnvironment" }
        logs_url: { type: string, description: "SSE log stream URL for async exec." }
        duration_ms: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ExecRecordList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ExecRecord" }
        next_cursor: { type: string }
        total: { type: integer }
    SessionContext:
      type: object
      description: "Session execution context. cwd must be under /workspace."
      properties:
        cwd: { type: string, example: /workspace }
        env:
          type: object
          additionalProperties: { type: string }
    ExecSessionResult:
      type: object
      description: "Synchronous Session execution result. Output fields are bounded by profile max_log_bytes."
      properties:
        exit_code: { type: integer }
        stdout: { type: string }
        stderr: { type: string }
        stdout_truncated: { type: boolean }
        stderr_truncated: { type: boolean }
        environment: { type: string, enum: [sandbox] }
        session_id: { type: string }
        workspace_id: { type: string }
        sandbox_id: { type: string }
        cwd: { type: string, example: /workspace }
    WorkspaceFileInfo:
      type: object
      properties:
        path: { type: string }
        sandbox_path: { type: string }
        environment: { type: string, enum: [workspace] }
        name: { type: string }
        kind: { type: string, enum: [file, dir] }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        mime: { type: string }
        mod_time: { type: string, format: date-time }
    WorkspaceListResult:
      type: object
      properties:
        path: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceFileInfo" }
        truncated: { type: boolean }
        limit: { type: integer }
    BuildDependencyRequest:
      type: object
      description: Build dependencies for an already resolved immutable environment.
      oneOf:
        - required: [resolution_id]
        - required: [environment]
      properties:
        resolution_id: { type: string, description: "Environment resolution ticket from /v1/environment:resolve." }
        environment:
          $ref: "#/components/schemas/ExactEnvironmentSelector"
        language: { type: string, enum: [python, node, javascript, typescript], description: "Dependency graph language being built, not a profile name." }
        manifest: { type: string }
        lockfile: { type: string }
        packages:
          type: array
          items: { type: string }
    DependencyBuild:
      type: object
      required: [fingerprint, profile_name, profile_revision, language, status, read_only, created_at, updated_at]
      properties:
        fingerprint: { type: string }
        tenant_id: { type: string }
        workspace_id: { type: string }
        profile_name: { type: string }
        profile_revision: { type: string }
        language: { type: string }
        status: { type: string, enum: [ready, failed, building] }
        cache_path: { type: string }
        read_only: { type: boolean }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ExactEnvironmentSelector:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile:
          type: object
          additionalProperties: false
          required: [name, revision]
          properties:
            name: { type: string, minLength: 1 }
            revision: { type: string, minLength: 1 }
    AuditEvent:
      type: object
      properties:
        event_id: { type: string }
        tenant_id: { type: string }
        user_id: { type: string }
        principal_id: { type: string }
        key_id: { type: string }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: string }
        status: { type: string }
        message: { type: string }
        trace_id: { type: string }
        created_at: { type: string, format: date-time }
    AuditEventList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_offset: { type: integer }
        total: { type: integer }
    ErrorResponse:
      type: object
      description: >-
        Unified error body (RFC 9457 spirit). request_id correlates with server TraceID and is
        always present. 429 responses also carry a Retry-After header.
      required: [error_code, message, request_id, details]
      properties:
        error_code:
          type: string
          enum:
            - UNAUTHENTICATED
            - PERMISSION_DENIED
            - INVALID_ARGUMENT
            - INVALID_SELECTOR
            - PRECONDITION_REQUIRED
            - PROFILE_NOT_FOUND
            - PROFILE_NOT_ENABLED
            - PROFILE_NOT_AVAILABLE
            - NO_MATCHING_PROFILE
            - RESOLUTION_EXPIRED
            - RESOLUTION_INVALID
            - SANDBOX_NOT_FOUND
            - SANDBOX_BUSY
            - SESSION_NOT_FOUND
            - SESSION_EXPIRED
            - SESSION_SUSPENDED
            - SESSION_HAS_ACTIVE_EXECS
            - IDEMPOTENCY_KEY_CONFLICT
            - EXEC_TIMEOUT
            - EXEC_CANCELLED
            - QUEUE_FULL
            - QUOTA_EXCEEDED
            - WORKSPACE_QUOTA_EXCEEDED
            - POLICY_DENIED
            - NETWORK_DENIED
            - RUNTIME_UNAVAILABLE
            - CONFLICT
            - INTERNAL_ERROR
        message: { type: string }
        request_id: { type: string }
        details:
          type: object
          required: [retryable]
          description: Machine-readable context. Always includes retryable and may include field, resource_type, retry_after_seconds, or unmet capabilities.
          properties:
            retryable: { type: boolean }
            field: { type: string }
            resource_type: { type: string }
            retry_after_seconds: { type: integer, minimum: 0 }
          additionalProperties: true
