        provisioner_id:
          type: string
        binding_version:
          type: integer
          minimum: 1
        budget_bytes:
          type: integer
          minimum: 1
        quota_mb:
          type: integer
          minimum: 32
        persistent:
          type: boolean
        hard_quota:
          type: boolean
        owner_tenant_id:
          type: string
        owner_user_id:
          type: string
        owner_run_id:
          type: string
        hard_quota_verified:
          type: boolean
        shared_attachment:
          type: boolean
        identity:
          type: object
          additionalProperties: false
          required:
          - source_identity
          - device_id
          - root_inode
          - backing_device_id
          - backing_inode
          - filesystem
          - filesystem_uuid
          - capacity_bytes
          - inode_capacity
          properties:
            source_identity:
              type: string
              pattern: ^[0-9a-f]{64}$
            device_id:
              type: integer
              minimum: 0
            root_inode:
              type: integer
              minimum: 1
            backing_device_id:
              type: integer
              minimum: 0
            backing_inode:
              type: integer
              minimum: 1
            filesystem:
              type: string
              enum:
              - ext4
            filesystem_uuid:
              type: string
              format: uuid
            capacity_bytes:
              type: integer
              minimum: 1
            inode_capacity:
              type: integer
              minimum: 1
              maximum: 65536
    MaintenanceProofQuery:
      type: object
      additionalProperties: false
      required:
      - context
      - operation_id
      - workspace_id
      - source_identity
      - claim_digest
      properties:
        context:
          $ref: '#/components/schemas/PlatformCallContext'
        operation_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
        workspace_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
        source_identity:
          type: string
          pattern: ^[0-9a-f]{64}$
        claim_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: 对不含claim_digest的完整请求作UTF-8规范JSON SHA256，绑定原来源与完整当前上下文。
    PlatformCallContext:
      type: object
      description: 完整原上下文；所有身份字段为至多256个UTF-8字节的非空字符串，拒绝ASCII控制字符与Unicode行分隔符U+2028/U+2029。
      additionalProperties: false
