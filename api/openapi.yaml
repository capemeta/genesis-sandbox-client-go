    ExecRecord:
      type: object
      description: Unified exec record. Shape aligns with JobResult for client parsing
        consistency (§7.5). For sync exec, stdout/stderr are inline. For async exec,
        use the logs SSE endpoint.
      required:
      - operation_id
      - exec_id
      - session_id
      - status
      - created_at
      properties:
        operation_id:
          type: string
          description: Stable caller identity for lookup after a lost submission response.
        exec_id:
          type: string
        session_id:
          type: string
        tenant_id:
          type: string
        user_id:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          - timed_out
          - interrupted
          description: timed_out means the execution exceeded its execution deadline;
            interrupted means execution began but the service restarted before a result
            could be confirmed. Reconcile possible side effects before retrying either
            state.
        exit_code:
          type: integer
        error_code:
          type: string
          description: Machine-readable error code. SERVICE_RESTART_INTERRUPTED means
            the exec began but its result was not confirmed; SERVICE_RESTART_CANCELLED_BEFORE_START
            means a queued exec never began.
        stop_confirmed:
          type: boolean
          description: Physical stop was confirmed. Terminal status alone never establishes
            stopped state.
        stdout:
          type: string
          description: Populated only for sync exec.
        stderr:
          type: string
          description: Populated only for sync exec.
        stdout_truncated:
          type: boolean
        stderr_truncated:
          type: boolean
        working_dir:
          type: string
        effective_environment:
          $ref: '#/components/schemas/EffectiveEnvironment'
        logs_url:
          type: string
          description: SSE log stream URL for async exec.
        duration_ms:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    ExecRecordList:
