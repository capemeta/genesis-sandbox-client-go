          resource_id:
            type: string
            maxLength: 128
            pattern: ^[A-Za-z0-9_.-]+$
          binding_version:
            type: integer
            minimum: 1
    TrustedExecutionGovernance:
      type: object
      additionalProperties: false
      description: 可信 Platform 运行层提供原调用与策略身份，不接受模型伪造，不携带宿主路径；完整原分配事实必须在命令副作用前持久登记。
      required:
      - context
      - lease_ref
      - platform_operation_id
      - request_digest
      - source_identity
      - workspace_id
      - authorized_work_write
      properties:
        context:
          allOf:
          - $ref: '#/components/schemas/PlatformCallContext'
          - type: object
            properties:
              invocation_id:
                type: string
                nullable: false
                minLength: 1
              execution_id:
                type: string
                nullable: false
                minLength: 1
              attempt_id:
                type: string
                nullable: false
                minLength: 1
        lease_ref:
          $ref: '#/components/schemas/PlatformLeaseRef'
        platform_operation_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
        request_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        source_identity:
          type: string
          pattern: ^[0-9a-f]{64}$
        workspace_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
        authorized_work_write:
          type: boolean
          enum:
          - true
          description: 未具备逐调用只读work内核机制，false在副作用前拒绝。
