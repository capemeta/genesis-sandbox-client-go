openapi: 3.0.3
info:
  title: Genesis Sandbox Service API
  description: 'Secure sandbox API for jobs, sessions, environment profiles, workspaces
    and artifacts. Public surface uses EnvironmentSelector for environment selection;
    bare sandbox leasing is an Advanced API (requires sandbox.advanced scope). Operations
    marked x-api-layer: advanced are not part of the Public surface.'
  version: 2.0.0
security:
- BearerAuth: []
paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: OK
  /readiness:
    get:
      summary: Readiness check
      security: []
      responses:
        '200':
          description: Ready
        '503':
          $ref: '#/components/responses/Error'
  /v1/readyz:
    get:
      summary: Readiness check compatibility path.
      security: []
      responses:
        '200':
          description: Ready
        '503':
          $ref: '#/components/responses/Error'
  /metrics:
    get:
      summary: Prometheus text metrics.
      security: []
      responses:
        '200':
          description: Metrics in Prometheus text format
          content:
            text/plain:
              schema:
                type: string
  /v1/sandbox/capabilities:
    x-api-layer: advanced
    get:
      summary: Get runtime capabilities, profiles, supported task types, languages,
        state policies, and queue limits.
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeCapabilities'
  /v1/runtime-profiles:
    x-api-layer: advanced
    get:
      summary: List visible runtime profiles (Advanced; exposes image/runtime internals).
        Public clients use /v1/environment/catalog.
      responses:
        '200':
          description: Runtime profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RuntimeProfile'
  /v1/environment/catalog:
    get:
      operationId: getEnvironmentCatalog
      summary: Public profile catalog with capability vocabulary and behavior limits.
        Supports ETag conditional requests.
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: capability
        in: query
        required: false
        description: Comma-separated capability filter (AND semantics; a card must
          expose all listed capabilities).
        schema:
          type: string
          example: runtime.python,tool.pdf
      - name: tag
        in: query
        required: false
        description: Comma-separated tag filter (OR semantics; a card matching any
          listed tag is kept).
        schema:
          type: string
          example: ml,data
      - name: If-None-Match
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Catalog cards visible to the principal
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentCatalog'
        '304':
          description: Not modified
  /v1/environment:resolve:
    post:
      operationId: resolveEnvironment
      summary: Resolve an EnvironmentSelector into a resolution ticket (default TTL
        30 minutes, usable multiple times within TTL, not consumed on use).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveEnvironmentRequest'
      responses:
        '200':
          description: Environment resolution ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentResolution'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /v1/sandboxes:lease:
    x-api-layer: advanced
    post:
      summary: Lease a sandbox (Advanced; requires sandbox.advanced scope).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaseRequest'
      responses:
        '200':
          description: Sandbox lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxLease'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/jobs:
    get:
      operationId: listJobs
      summary: List jobs for the authenticated tenant.
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          - timed_out
          - interrupted
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Paged job records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
    post:
      operationId: submitJob
      summary: Submit a job. Returns immediately unless ?wait is given; on wait expiry
        returns 200 with status=running and logs_url (not an error).
      parameters:
      - name: wait
        in: query
        required: false
        description: Max duration to wait synchronously for completion, e.g. 30s.
          Bounded by server config.
        schema:
          type: string
          example: 30s
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitJobRequest'
      responses:
        '202':
          description: Job admitted and returned in queued or running state. Poll
            the job resource or consume logs_url.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResult'
        '200':
          description: Returned only when ?wait is supplied; may be terminal or still
            running when the wait bound expires.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResult'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/audits:
    get:
      operationId: listAuditEvents
      summary: List audit events for the authenticated tenant.
      parameters:
      - name: principal_id
        in: query
        schema:
          type: string
      - name: key_id
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          type: string
      - name: resource_type
        in: query
        schema:
          type: string
      - name: resource_id
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Paged audit events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
  /v1/sandboxes:
    x-api-layer: advanced
    get:
      summary: List sandbox leases for the authenticated tenant.
      responses:
        '200':
          description: Sandbox leases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SandboxLease'
  /v1/jobs/{id}:
    get:
      operationId: getJob
      summary: Get a job result.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Job result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResult'
        '404':
          $ref: '#/components/responses/Error'
  /v1/jobs/{id}:cancel:
    post:
      operationId: cancelJob
      summary: Cancel a queued or running job. Cancel is not delete; the job record
        remains queryable.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Cancelled
        '404':
          $ref: '#/components/responses/Error'
  /v1/jobs/{id}/logs:
    get:
      operationId: streamJobLogs
      summary: Stream job logs via SSE.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: cursor
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: SSE log stream
  /v1/jobs/{id}/files:
    post:
      operationId: uploadJobFile
      summary: Upload an input file for a job. The file name is passed by query parameter
        `name` and the body is raw bytes.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: name
        in: query
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Artifact manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
  /v1/jobs/{id}/artifacts:
    get:
      operationId: listJobArtifacts
      summary: List job artifacts.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: Artifacts
          headers:
            X-Total-Count:
              schema:
                type: integer
            X-Next-Offset:
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Artifact'
  /v1/artifacts/{id}:
    get:
      operationId: downloadArtifact
      summary: Download an artifact by id. Supports HTTP Range or text offset/limit.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: Range
        in: header
        schema:
          type: string
          example: bytes=0-1023
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: Artifact bytes
        '404':
          $ref: '#/components/responses/Error'
  /v1/workspaces:
    post:
      summary: Create a workspace state key.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
  /v1/storage-resources/{storageRef}/{resourceID}:
    get:
      summary: Inspect an administrator-approved persistent storage resource.
      parameters:
      - name: storageRef
        in: path
        required: true
        schema:
          type: string
      - name: resourceID
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Authenticated source identity and verified hard quota; attachment
            capability is reported separately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedStorageResource'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/workspaces/{id}:
    get:
      summary: Get a workspace.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
    delete:
      summary: Delete a workspace and local artifacts.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Deleted
  /v1/workspaces/{id}/lifecycle:
    post:
      operationId: controlWorkspaceLifecycle
      summary: Bounded persistent storage hold or parent terminal retention; never
        acquires computation.
      description: Requires sandbox.workspace.lifecycle scope and authenticated workspace
        owner. Disabled by default. Send mutation once; after an unknown response
        query the original operation, never replay. Request digest is lowercase SHA256
        of compact UTF8 sorted-key JSON with all six request fields, zero omitted
        integers restored as zero, absent terminal_at as null, terminal_at normalized
        to UTC with exactly six fractional digits and Z. Nanosecond precision is rejected.
      parameters:
      - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceLifecycleRequest'
      responses:
        '200':
          description: Original storage lifecycle receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceLifecycleReceipt'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/workspaces/{id}/lifecycle:lookup:
    get:
      operationId: lookupWorkspaceLifecycle
      summary: Read-only original lifecycle operation lookup.
      description: Unknown or history_expired never proves that a mutation did not
        execute. Bounded receipts and irreversible operation tombstones prevent replay.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: operation_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_.-]+$
      responses:
        '200':
          description: Original operation facts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceLifecycleLookup'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/sessions:
    post:
      operationId: createSession
      summary: Create a logical session backed by a persistent workspace. No runtime
        is created until the first exec.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
  /v1/sessions:lookup:
    get:
      operationId: lookupSessionByOperation
      summary: Find a session by its creation idempotency key, scoped to the authenticated
        tenant and user.
      parameters:
      - name: idempotency_key
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Maximum 128 UTF-8 bytes.
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}:
    get:
      operationId: getSession
      summary: Get a session.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
    delete:
      operationId: deleteSession
      summary: Delete the logical session and release its active runtime. Workspace
        retention is handled separately.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Deleted
  /v1/sessions/{id}/workspace-view:
    get:
      operationId: getWorkspaceView
      summary: Get actual authenticated runtime, quota and projection facts.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Confirmed result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceViewFacts'
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: prepareOrSealWorkspaceView
      summary: Prepare trusted projection or irreversibly seal input and payload.
        Active executions reject changes.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: action
        in: query
        required: true
        schema:
          type: string
          enum:
          - prepare
          - seal
      requestBody:
        description: Required for prepare; seal has no request body.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspacePreparationRequest'
      responses:
        '200':
          description: Immutable original preparation receipt, or sealed facts.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/WorkspacePreparationReceipt'
                - $ref: '#/components/schemas/WorkspaceViewFacts'
        default:
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/workspace-view/preparations/{operationID}:
    get:
      operationId: lookupWorkspacePreparation
      summary: Read the original durable preparation proof without runtime mutation
        or renewal.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: operationID
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
      - name: request_digest
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      responses:
        '200':
          description: Original unknown intent or immutable completed proof.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePreparationReceipt'
        '404':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/ownership:
    get:
      operationId: getSessionOwnership
      summary: Read ownership for original cleanup without granting logs, files or
        compute access.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Original ownership, independent of compute TTL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOwnership'
        default:
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/history:
    get:
      operationId: getSessionHistory
      summary: Read retained authenticated ownership without renewing execution permission.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Confirmed result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/workspace:purge:
    post:
      operationId: purgeSessionWorkspace
      summary: Delete stopped workspace while retaining execution logs and ownership.
      parameters:
      - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspacePreparationRequest'
      responses:
        '200':
          description: Confirmed result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePurgeReceipt'
        default:
          $ref: '#/components/responses/Error'
  /v1/workspaces/{id}/purges/{operationID}:
    get:
      operationId: lookupStoragePurge
      summary: Read the immutable original storage deletion proof independent of compute
        TTL.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: operationID
        in: path
        required: true
        schema:
          type: string
      - name: request_digest
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      responses:
        '200':
          description: Original proof for authenticated tenant, user and principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePurgeReceipt'
        default:
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/workspace/purges/{operationID}:
    get:
      operationId: lookupWorkspacePurge
      summary: Read the original purge ledger without restarting deletion.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: operationID
        in: path
        required: true
        schema:
          type: string
      - name: request_digest
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      responses:
        '200':
          description: Original result, unknown is not safe to replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacePurgeReceipt'
        default:
          $ref: '#/components/responses/Error'
  /v1/workspaces/{id}/maintenance-proof:query:
    post:
      operationId: queryWorkspaceMaintenanceProof
      summary: 在原来源管理身份下只读查询完整停止闭包与真实叶身份，不执行、停止或重试原命令。
      parameters:
      - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceProofQuery'
      responses:
        '200':
          description: 原授权来源及调用停止证明。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceSourceProof'
        default:
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}:renew:
    post:
      operationId: renewSession
      summary: Extend a session lease (client heartbeat) within max lifetime policy.
      parameters:
      - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewRequest'
      responses:
        '200':
          description: Renewed session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '409':
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}:suspend:
    post:
      operationId: suspendSession
      summary: Release the ephemeral runtime while preserving the logical session
        and workspace.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: force
        in: query
        required: false
        description: When true, cancel all running execs before suspending.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Dormant session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '409':
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}:resume:
    post:
      operationId: resumeSession
      summary: Resume a named session runtime
      description: Recreates or validates the short-lived runtime for an active logical
        session and returns its current runtime binding. The durable workspace and
        session identity are preserved.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Session runtime is active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/exec:
    post:
      operationId: execSession
      summary: Synchronous exec inside a named session (short commands < 30s). Returns
        ExecRecord with stdout/stderr inline.
      parameters:
      - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecSessionRequest'
      responses:
        '200':
          description: Session execution result (ExecRecord with stdout/stderr inline)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecRecord'
  /v1/sessions/{id}/exec:async:
    post:
      operationId: execSessionAsync
      summary: Asynchronous exec. Returns immediately with exec_id; use logs endpoint
        for SSE streaming.
      parameters:
      - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncExecRequest'
      responses:
        '201':
          description: Exec record (status=queued)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecRecord'
        '429':
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/execs:
    get:
      operationId: listSessionExecs
      summary: List exec records for a session.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Exec record list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecRecordList'
  /v1/sessions/{id}/execs:lookup:
    get:
      operationId: lookupExecByOperation
      summary: Find an exec by a stable caller operation ID within the authenticated
        session.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: operation_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      responses:
        '200':
          description: Exec record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecRecord'
        '404':
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/execs/{execId}:
    get:
      operationId: getExecRecord
      summary: Get a single exec record by ID.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: execId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Exec record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecRecord'
        '404':
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/execs/{execId}/logs:
    get:
      operationId: streamExecLogs
      summary: SSE log stream for an async exec. Supports cursor-based reconnection
        via Last-Event-ID header or ?cursor param.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: execId
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
          default: 0
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: SSE event stream (stdout/stderr/status/truncated events with
            monotonic cursor as id field)
          content:
            text/event-stream:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/execs/{execId}:cancel:
    post:
      operationId: cancelExec
      summary: Cancel a running or queued exec (SIGINT → grace → SIGKILL). Record
        is preserved for query.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: execId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updated exec record (status=cancelled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecRecord'
        '404':
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/context:
    get:
      operationId: getSessionContext
      summary: Get persistent session execution context (cwd only).
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Session context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
    patch:
      operationId: patchSessionContext
      summary: Update session execution context. cwd must be under /workspace.
      parameters:
      - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionContext'
      responses:
        '200':
          description: Updated session context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
        '400':
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/files:
    get:
      operationId: downloadSessionFile
      summary: Download a file from a session workspace.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: path
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: uploadSessionFile
      summary: Upload or overwrite a file in a session workspace.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: path
        in: query
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: false
        description: Replace only when the current SHA-256 ETag matches.
        schema:
          type: string
      - name: If-None-Match
        in: header
        required: false
        description: Use `*` to create only when the file does not exist.
        schema:
          type: string
          enum:
          - '*'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileInfo'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeSessionFile
      summary: Remove a file or directory from a session workspace.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: path
        in: query
        required: true
        schema:
          type: string
      - name: recursive
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: If-Match
        in: header
        schema:
          type: string
        description: Exact content hash for atomic conditional deletion.
      responses:
        '200':
          description: Removed
        default:
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/files:list:
    get:
      operationId: listSessionFiles
      summary: List session workspace files.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: path
        in: query
        required: false
        schema:
          type: string
          default: .
      - name: recursive
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1000
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: File list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResult'
        default:
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/files:stat:
    get:
      operationId: statSessionFile
      summary: Stat a session workspace file or directory.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: path
        in: query
        required: false
        schema:
          type: string
          default: .
      responses:
        '200':
          description: File metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileInfo'
        default:
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/files:executable:
    patch:
      operationId: setSessionFileExecutable
      summary: Change executable metadata of a regular file on Linux.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: path
        in: query
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - executable
              properties:
                executable:
                  type: boolean
                expected_executable:
                  type: boolean
      responses:
        '200':
          description: Updated file metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileInfo'
        default:
          $ref: '#/components/responses/Error'
  /v1/sessions/{id}/dirs:
    post:
      operationId: mkdirSessionDir
      summary: Create a directory in a session workspace.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: path
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Directory metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceFileInfo'
        default:
          $ref: '#/components/responses/Error'
  /v1/dependencies:build:
    post:
      operationId: buildDependencies
      summary: Build or resolve a read-only dependency cache fingerprint.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildDependencyRequest'
      responses:
        '200':
          description: Dependency build metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyBuild'
  /v1/dependencies/{id}:
    get:
      operationId: getDependencyBuild
      summary: Get dependency build metadata by fingerprint.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Dependency build metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DependencyBuild'
  /v1/sandboxes/{id}:
    x-api-layer: advanced
    get:
      summary: Get sandbox lease/status/effective policy.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Sandbox lease. ETag is the resource_version.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxLease'
        '404':
          $ref: '#/components/responses/Error'
    delete:
      summary: Destroy a sandbox and remove its lease.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Destroyed
        '404':
          $ref: '#/components/responses/Error'
  /v1/sandboxes/{id}/metadata:
    x-api-layer: advanced
    patch:
      summary: Patch sandbox metadata with If-Match resource_version precondition.
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                nullable: true
      responses:
        '200':
          description: Updated sandbox lease
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxLease'
        '409':
          $ref: '#/components/responses/Error'
  /v1/sandboxes/{id}:release:
    x-api-layer: advanced
    post:
      summary: Release a sandbox lease (single canonical release verb).
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Released
  /v1/sandboxes/{id}:renew:
    x-api-layer: advanced
    post:
      summary: Extend an active sandbox lease within max lifetime policy.
      parameters:
      - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewRequest'
      responses:
        '200':
          description: Renewed sandbox lease
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxLease'
        '409':
          $ref: '#/components/responses/Error'
  /v1/sandboxes/{id}/sessions:
    x-api-layer: advanced
    post:
      summary: Execute inside a sandbox-scoped session.
      parameters:
      - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecSessionRequest'
      responses:
        '200':
          description: Session execution result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecSessionResult'
  /v1/sandboxes/{id}/snapshots:
    x-api-layer: advanced
    post:
      summary: Create a sandbox snapshot.
      description: Reserved endpoint. Snapshot is currently unsupported and returns
        POLICY_DENIED.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '403':
          $ref: '#/components/responses/Error'
  /v1/snapshots/{id}/restore:
    x-api-layer: advanced
    post:
      summary: Restore a sandbox from a snapshot (currently unsupported).
      description: Reserved endpoint. Restore is currently unsupported and returns
        POLICY_DENIED.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '403':
          $ref: '#/components/responses/Error'
  /v1/sandboxes/{id}/viewer:
    get:
      summary: Get a lease-bound viewer descriptor for a GUI sandbox.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Viewer descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerDescriptor'
        '404':
          $ref: '#/components/responses/Error'
  /v1/sandboxes/{id}/gui:start:
    post:
      summary: Start the GUI/noVNC stack inside a GUI-capable sandbox.
      parameters:
      - $ref: '#/components/parameters/ID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartGUIRequest'
      responses:
        '200':
          description: Viewer descriptor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewerDescriptor'
  /v1/sandboxes/{id}/gui:stop:
    post:
      summary: Stop the GUI/noVNC stack inside a sandbox.
      parameters:
      - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: GUI stopped
  /v1/sandboxes/{id}/viewer-proxy/{path}:
    get:
      summary: Authenticated reverse proxy to the sandbox viewer endpoint.
      security: []
      parameters:
      - $ref: '#/components/parameters/ID'
      - name: path
        in: path
        required: true
        schema:
          type: string
      - name: token
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Proxied noVNC asset or WebSocket upgrade
        '403':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    EnvironmentSelector:
      type: object
      additionalProperties: false
      description: Unified environment selection. `profile` means an explicit environment
        name chosen by the caller; `hints` means capability-based auto selection performed
        by the server; both absent means the default public profile. `profile` and
        `hints` are mutually exclusive (INVALID_SELECTOR when both present).
      properties:
        profile:
          $ref: '#/components/schemas/ProfileReference'
        hints:
          $ref: '#/components/schemas/EnvHints'
    ProfileReference:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          example: office-basic
        revision:
          type: string
          description: Optional pinned revision; defaults to latest.
    EnvHints:
      type: object
      additionalProperties: false
      properties:
        capabilities:
          type: array
          description: Namespaced capability tags (runtime.*, tool.*, document.*,
            browser.*).
          items:
            type: string
            example: document.pdf
        strict:
          type: boolean
          default: false
          description: When true, zero matches return NO_MATCHING_PROFILE instead
            of falling back to the default profile.
        description:
          type: string
          description: Audit-only free text; never consumed by the resolver.
    EffectiveEnvironment:
      type: object
      description: Answers what was selected, why, and whether it was degraded. Never
        exposes image/runtime/host internals.
      properties:
        profile_name:
          type: string
        profile_revision:
          type: string
          description: Opaque server-generated revision string.
        selection_mode:
          type: string
          enum:
          - profile
          - auto
        selection_reason:
          type: array
          description: Traceability, e.g. default fallback cause or unknown/unsatisfied
            capabilities.
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
        degraded:
          type: boolean
          description: True only when an approved policy/runtime fallback changed
            the requested execution guarantee.
    ResolveEnvironmentRequest:
      type: object
      additionalProperties: false
      required:
      - environment
      properties:
        environment:
          $ref: '#/components/schemas/EnvironmentSelector'
        include_facts:
          type: boolean
          default: false
          description: Request actual authenticated profile attestation; unavailable
            enforcement fails closed.
        ttl_seconds:
          type: integer
          minimum: 60
          description: Requested ticket TTL; bounded by server config (default 30
            minutes).
    SessionOwnership:
      type: object
      additionalProperties: false
      required:
      - session_id
      - workspace_id
      - tenant_id
      - principal_id
      - user_id
      - profile_revision
      properties:
        session_id:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        tenant_id:
          type: string
          minLength: 1
        principal_id:
          type: string
          minLength: 1
        user_id:
          type: string
          minLength: 1
        profile_revision:
          type: string
          minLength: 1
    WorkspacePurgeReceipt:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - request_digest
      - status
      - session_id
      - workspace_id
      - profile_revision
      - tenant_id
      - principal_id
      - user_id
      properties:
        operation_id:
          type: string
        request_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          type: string
          enum:
          - unknown
          - purged
        session_id:
          type: string
        workspace_id:
          type: string
        profile_revision:
          type: string
        tenant_id:
          type: string
        principal_id:
          type: string
        user_id:
          type: string
    WorkspacePreparationRequest:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - request_digest
      properties:
        operation_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        request_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
    WorkspacePreparationReceipt:
      type: object
      additionalProperties: false
      required:
      - operation_id
      - request_digest
      - status
      - session_id
      - workspace_id
      - sandbox_id
      - profile_revision
      - tenant_id
      - principal_id
      - user_id
      properties:
        operation_id:
          type: string
        request_digest:
          type: string
          pattern: ^[a-f0-9]{64}$
        status:
          type: string
          enum:
          - unknown
          - prepared
        session_id:
          type: string
        workspace_id:
          type: string
        sandbox_id:
          type: string
        profile_revision:
          type: string
        tenant_id:
          type: string
        principal_id:
          type: string
        user_id:
          type: string
        facts:
          $ref: '#/components/schemas/WorkspaceViewFacts'
    WorkspaceViewFacts:
      type: object
      required:
      - os
      - arch
      - image_digest
      - mechanisms
      - resource_limits
      - network_mode
      - view_state
      - runtime_versions
      - runtime_executables
      properties:
        session_id:
          type: string
        workspace_id:
          type: string
        profile_revision:
          type: string
        os:
          type: string
        arch:
          type: string
        image_digest:
          type: string
        mechanisms:
          type: array
          items:
            type: string
        resource_limits:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 1
        runtime_versions:
          type: object
          additionalProperties:
            type: string
        runtime_executables:
          type: object
          additionalProperties:
            type: string
        network_mode:
          type: string
        view_state:
          type: string
          enum:
          - unprepared
          - prepared
          - sealed
        readonly_regions:
          type: array
          items:
            type: string
    EnvironmentResolution:
      type: object
      properties:
        facts:
          $ref: '#/components/schemas/WorkspaceViewFacts'
        resolution_id:
          type: string
        profile_name:
          type: string
        profile_revision:
          type: string
        selection_mode:
          type: string
          enum:
          - profile
          - auto
        selection_reason:
          type: array
          items:
            type: string
        capabilities:
          type: array
          items:
            type: string
        degraded:
          type: boolean
          description: True when policy approved a runtime fallback for this resolution.
        expires_at:
          type: string
          format: date-time
    EnvironmentCatalog:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCard'
        capability_vocabulary:
          type: array
          description: Full namespaced capability vocabulary recognized by the auto
            resolver.
          items:
            type: string
        default_profile:
          type: string
        next_offset:
          type: integer
        total:
          type: integer
    CatalogCard:
      type: object
      required:
      - name
      - revision_available
      properties:
        name:
          type: string
        profile_revision:
          type: string
          description: Opaque immutable revision for exact Resolve after Catalog selection;
            omitted while immutable image identity cannot be verified.
        revision_available:
          type: boolean
          description: True only when this card carries a verified immutable profile
            revision. When false, omit profile_revision and resolve by profile name
            to pin the current image.
        display_name:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        use_when:
          type: array
          description: Display-only guidance; never consumed by the resolver.
          items:
            type: string
        avoid_when:
          type: array
          description: Display-only guidance; never consumed by the resolver.
          items:
            type: string
        limits:
          $ref: '#/components/schemas/CatalogCardLimits'
        features:
          $ref: '#/components/schemas/CatalogCardFeatures'
    CatalogCardLimits:
      type: object
      properties:
        max_exec_timeout_seconds:
          type: integer
        max_session_ttl_seconds:
          type: integer
        workspace_quota_mb:
          type: integer
          description: Maximum quota accepted for a Session workspace; newly created
            Session workspaces use this size, and pre-created workspaces may be smaller
            but cannot exceed it.
        max_log_bytes:
          type: integer
          format: int64
        max_concurrent_execs:
          type: integer
    CatalogCardFeatures:
      type: object
      properties:
        viewer:
          type: boolean
        suspend_resume:
          type: boolean
    StartGUIRequest:
      type: object
      properties:
        kind:
          type: string
          enum:
          - novnc
        resolution:
          type: string
          example: 1280x800
        ttl_seconds:
          type: integer
          minimum: 60
          maximum: 3600
          default: 900
        metadata:
          type: object
          additionalProperties:
            type: string
    ViewerDescriptor:
      type: object
      properties:
        sandbox_id:
          type: string
        runtime_profile:
          type: string
        status:
          type: string
          enum:
          - starting
          - ready
          - stopped
        kind:
          type: string
          enum:
          - novnc
        ready:
          type: boolean
        page_url:
          type: string
        websocket_url:
          type: string
        proxy_url:
          type: string
        access_token:
          type: string
        token_header:
          type: string
          example: X-Genesis-Viewer-Token
        expires_at:
          type: string
          format: date-time
        renew_on_access:
          type: boolean
    ViewerPolicy:
      type: object
      properties:
        supported:
          type: boolean
        default_kind:
          type: string
        allowed_kinds:
          type: array
          items:
            type: string
        port:
          type: integer
        token_ttl_seconds:
          type: integer
        renew_on_access:
          type: boolean
        artifacts:
          type: array
          items:
            type: string
    PlatformSpec:
      type: object
      properties:
        os:
          type: string
