          - enterprise
        invocation_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
        execution_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
        attempt_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
    MaintenanceSourceProof:
      type: object
      additionalProperties: false
      description: 原源管理身份下真实FD枚举；未知原调用屏障或未停止调用明确拒绝。仅文件API历史允许空calls，但foreign叶必须关联唯一原UID登记。
      required:
      - context
      - operation_id
      - claim_digest
      - source_identity
      - root_device
      - root_inode
      - calls
      - leaves
      properties:
        context:
          $ref: '#/components/schemas/PlatformCallContext'
        operation_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
        claim_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        source_identity:
          type: string
          pattern: ^[0-9a-f]{64}$
        root_device:
          type: integer
          format: int64
          minimum: 0
        root_inode:
          type: integer
          format: int64
          minimum: 1
        calls:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/MaintenanceCall'
        leaves:
          type: array
          maxItems: 100000
          items:
            $ref: '#/components/schemas/MaintenanceLeaf'
    MaintenanceCall:
      type: object
      additionalProperties: false
      required:
      - call_id
      - context
      - lease_ref
      - operation_id
      - request_digest
      - execution_id
      - output_directory
      - uid
      - gid
      - root_device
      - root_inode
      - authorized_work_write
      - stop_confirmed
      properties:
        call_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
        context:
          $ref: '#/components/schemas/PlatformCallContext'
        lease_ref:
          $ref: '#/components/schemas/PlatformLeaseRef'
        operation_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
        request_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        execution_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
        output_directory:
          type: string
          pattern: ^output/[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        uid:
          type: integer
          format: int64
          minimum: 1
        gid:
          type: integer
          format: int64
          minimum: 1
          description: 原输出根私有GID，不是负载主GID65532。
        root_device:
          type: integer
          format: int64
          minimum: 0
        root_inode:
          type: integer
          format: int64
          minimum: 1
        authorized_work_write:
          type: boolean
        stop_confirmed:
          type: boolean
          enum:
          - true
    PlatformLeaseRef:
      type: object
      additionalProperties: false
      required:
      - provider_id
      - lease_id
