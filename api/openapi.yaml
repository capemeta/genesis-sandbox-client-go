        tenant_id:
          type: string
        user_id:
          type: string
        principal_id:
          type: string
        key_id:
          type: string
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        status:
          type: string
        message:
          type: string
        trace_id:
          type: string
        created_at:
          type: string
          format: date-time
    AuditEventList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_offset:
          type: integer
        total:
          type: integer
    ErrorResponse:
      type: object
      description: Unified error body (RFC 9457 spirit). request_id correlates with
        server TraceID and is always present. 429 responses also carry a Retry-After
        header.
      required:
      - error_code
      - message
      - request_id
      - details
      properties:
        error_code:
          type: string
          enum:
          - UNAUTHENTICATED
          - PERMISSION_DENIED
          - INVALID_ARGUMENT
          - INVALID_SELECTOR
          - PRECONDITION_REQUIRED
          - PROFILE_NOT_FOUND
          - PROFILE_NOT_ENABLED
          - PROFILE_NOT_AVAILABLE
          - NO_MATCHING_PROFILE
          - RESOLUTION_EXPIRED
          - RESOLUTION_INVALID
          - SANDBOX_NOT_FOUND
          - SANDBOX_BUSY
          - SESSION_NOT_FOUND
          - SESSION_EXPIRED
          - SESSION_SUSPENDED
          - SESSION_HAS_ACTIVE_EXECS
          - IDEMPOTENCY_KEY_CONFLICT
          - EXEC_TIMEOUT
          - EXEC_CANCELLED
          - QUEUE_FULL
          - QUOTA_EXCEEDED
          - WORKSPACE_QUOTA_EXCEEDED
          - POLICY_DENIED
          - NETWORK_DENIED
          - RUNTIME_UNAVAILABLE
          - CONFLICT
          - INTERNAL_ERROR
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          required:
          - retryable
          description: Machine-readable context. NO_MATCHING_PROFILE includes a reason,
            unknown and unmet capabilities, and the count of unavailable matching
            candidates without exposing profile names.
          properties:
            retryable:
              type: boolean
            field:
              type: string
            resource_type:
              type: string
            retry_after_seconds:
              type: integer
              minimum: 0
            reason:
              type: string
              enum:
              - no_matching_profile
              - unknown_capabilities
              - matching_profiles_unavailable
            unknown_capabilities:
              type: array
              items:
                type: string
            unmet_capabilities:
              type: array
              items:
                type: string
            unavailable_candidate_count:
              type: integer
              minimum: 0
          additionalProperties: true
    SharedStorageResource:
      type: object
      additionalProperties: false
