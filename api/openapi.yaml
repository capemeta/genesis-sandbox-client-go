      - inode
      - uid
      - gid
      - mode
      - directory
      - call_id
      properties:
        path:
          type: string
          description: work/output完整相对路径，含两个公共根，不含宿主路径。
        device:
          type: integer
          format: int64
          minimum: 0
        inode:
          type: integer
          format: int64
          minimum: 1
        uid:
          type: integer
          format: int64
          minimum: 0
        gid:
          type: integer
          format: int64
          minimum: 0
        mode:
          type: integer
          minimum: 0
          maximum: 4095
          description: POSIX权限值含sticky/setgid，排除文件类型位。
        directory:
          type: boolean
        call_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
    WorkspaceBindingRequest:
