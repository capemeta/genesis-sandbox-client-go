      - tenant_id
      - user_id
      - run_id
      - trace_id
      - authorization_scope
      - decision_reference
      - subject_kind
      - invocation_id
      - execution_id
      - attempt_id
      properties:
        tenant_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
        user_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
        run_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
        trace_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
        authorization_scope:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
        decision_reference:
          type: string
          nullable: true
          minLength: 1
          maxLength: 256
          pattern: ^[^\u0000-\u001f\u007f\u2028\u2029]+$
        subject_kind:
          type: string
